<!DOCTYPE html>
<html>
<head>
<title>For My Love ❤️</title>
<style>
body {
  text-align: center;
  font-family: Arial;
  background-color: #ffe6f0;
  margin-top: 100px;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>My Dear Wife ❤️</h1>
<h2>Will you always stay with me forever? 🥺</h2>

<button onclick="yesClicked()">YES 💖</button>
<button id="noBtn" onmouseover="moveNo()">NO 😜</button>

<script>
function yesClicked() {
  alert("Yayyy ❤️ I am the happiest husband in the world! Thank you for being with me through this all the difficult phases in my life❤️");
}

function moveNo() {
  var btn = document.getElementById("noBtn");
  var x = Math.random() * window.innerWidth;
  var y = Math.random() * window.innerHeight;
  btn.style.position = "absolute";
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}
</script>

</body>
</html>
